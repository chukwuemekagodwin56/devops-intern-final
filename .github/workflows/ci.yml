name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t nginx-app:ci app/
      - name: Save image to a file
        run: docker save nginx-app:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      - name: Start container
        run: docker run -d --name app -p 8080:8080 nginx-app:ci
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/healthz >/dev/null; then
              echo "Ready after $i attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become ready" >&2
          docker logs app
          exit 1
      - name: Run healthcheck script
        run: ./scripts/healthcheck.sh http://localhost:8080

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag nginx-app:ci "$IMAGE:${{ github.sha }}"
          docker tag nginx-app:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
